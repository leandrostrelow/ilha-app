name: Artefato público de staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilha-staging-build
  cancel-in-progress: true

jobs:
  build:
    name: Gerar dist isolado, sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      # Somente valores públicos do GitHub Environment `staging`.
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_VAPID_PUBLIC_KEY: ${{ vars.STAGING_VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout sem credencial persistente
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Ativar pnpm fixado no package.json
        run: corepack enable

      - name: Instalar dependências reproduzíveis
        run: pnpm install --frozen-lockfile

      - name: Validar fontes antes do empacotamento
        run: pnpm run verify

      - name: Gerar dist com constantes públicas de staging
        run: node scripts/build-staging.mjs

      - name: Publicar somente o artefato estático da execução
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ilha-staging-static-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
