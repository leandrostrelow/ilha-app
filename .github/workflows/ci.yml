name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sem credencial persistente
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Ativar pnpm fixado no package.json
        run: corepack enable

      - name: Instalar dependências reproduzíveis
        run: pnpm install --frozen-lockfile

      - name: Verificação completa da aplicação
        run: pnpm run verify

  database:
    name: Migrations em Postgres real e pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_CI_DIR: ${{ runner.temp }}/ilha-supabase-ci
      SUPABASE_HOME: ${{ runner.temp }}/supabase-home
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout sem credencial persistente
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Ativar pnpm fixado no package.json
        run: corepack enable

      - name: Instalar CLI Supabase fixada no lockfile
        run: pnpm install --frozen-lockfile

      - name: Confirmar versão e descobrir comandos da CLI
        run: |
          pnpm exec supabase --version
          pnpm exec supabase --help
          pnpm exec supabase db --help
          pnpm exec supabase test db --help
          pnpm exec supabase stop --help

      - name: Preparar baseline e bootstrap exclusivamente sintético
        run: node scripts/prepare-supabase-ci.mjs "$SUPABASE_CI_DIR"

      - name: Aplicar toda a cadeia em um Postgres Supabase novo
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" db start

      - name: Recriar e reaplicar migrations do zero
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" db reset --local

      - name: Executar contratos pgTAP de segurança e integridade
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" test db --local

      - name: Validar funções PL/pgSQL no banco real
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" db lint --local --schema public --level error --fail-on error

      - name: Conferir histórico local de migrations
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" migration list --local

      - name: Encerrar containers efêmeros
        if: always()
        run: pnpm exec supabase --workdir "$SUPABASE_CI_DIR" stop --no-backup
