project_id = "ilha-app"

[auth]
site_url = "http://127.0.0.1:8769"
additional_redirect_urls = [
  "http://127.0.0.1:8769/**",
  "http://localhost:8769/**",
  "https://ilha-app-staging.vercel.app/**",
  "https://app.ilhatenis.com/**"
]

[auth.email]
enable_signup = true
# A aprovação é responsabilidade do status PENDENTE/ATIVO em app_clients.
# Assim o cliente autentica e mantém a sessão antes da liberação do clube.
enable_confirmations = false

# Provider/public callbacks authenticate themselves inside the function. They
# must reach the handler without an end-user JWT.
[functions.asaas-payment-webhook]
verify_jwt = false

# Monthly billing accepts either an authenticated ADM request (finance.write)
# or the private scheduler token and enforces both paths inside the handler.
[functions.app-monthly-billing]
verify_jwt = false

[functions.store-checkout]
verify_jwt = false
# Validates the user JWT with Auth, checks store permission for counter sales,
# and never trusts price/identity supplied by the customer.

[functions.bar-order-push]
verify_jwt = false

[functions.client-notification-dispatch]
verify_jwt = false

[functions.protected-access-recovery]
verify_jwt = false

[functions.tournament-register]
verify_jwt = false

[functions.tournament-internal-register]
verify_jwt = false
# Residual public route: the handler stays fail-closed unless the independently
# managed TOURNAMENT_INTERNAL_REGISTRATION_ENABLED secret is exactly "true".

[functions.tournament-payment-expiry]
verify_jwt = false
# Scheduled pg_net callback authenticated by x-tournament-expiry-token. The
# publishable key is sent only as apikey because sb_publishable_* is not a JWT.

[functions.tournament-public-push]
verify_jwt = false
# Public subscribe requests validate origin, publishable key and payload in the
# handler. Broadcasts additionally require a user JWT with tournament access.

[functions.bet-public-api]
verify_jwt = false
# Public reads and participant access are protected inside the handler by
# origin validation, Turnstile, rate limits and a derived access-code hash.

[functions.arcade-api]
verify_jwt = false
# Guest identities use a random private browser token. Scores are replayed on
# the server with a server-issued seed, rate-limited and saved idempotently.

[functions.lesson-leads-api]
verify_jwt = false
# Public submit only; strict validation, rate limits and idempotent intake.
# ALL management actions verify Auth JWT + current has_club_permission('classes').

# Management endpoints require a valid user JWT at the gateway and repeat the
# permission check in the handler before constructing a service-role client.
[functions.bar-user-access]
verify_jwt = true

[functions.client-broadcast-push]
verify_jwt = true

[functions.club-user-access]
verify_jwt = true

[functions.family-member-access]
verify_jwt = true

[functions.tournament-admin-api]
verify_jwt = true

[functions.bet-admin-api]
verify_jwt = true
[functions.event-ticketing]
verify_jwt = false
