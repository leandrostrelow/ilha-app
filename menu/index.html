<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13233d" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cardápio do Bar | Ilha Tênis</title>
  <link rel="icon" href="../icons/ilha-bar-192.png" sizes="192x192" />
  <script>
    (function () {
      if (new URLSearchParams(window.location.search).get('view') === 'mobile') {
        document.documentElement.dataset.menuDisplay = 'mobile';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --navy: #13233d;
      --navy-soft: #1d3151;
      --teal: #087f8d;
      --green: #08ad56;
      --lime: #caef70;
      --ink: #14233a;
      --muted: #667289;
      --line: #dbe5e8;
      --surface: #ffffff;
      --menu-columns: 2;
      --menu-product-height: 91px;
      --menu-image-size: 76px;
      --menu-name-size: 16px;
      --menu-price-size: 22px;
      --menu-category-height: 48px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #eef4f5;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 8% 0%, rgba(202, 239, 112, .2), transparent 28%),
        radial-gradient(circle at 96% 26%, rgba(8, 127, 141, .13), transparent 27%),
        #eef4f5;
    }

    body[data-menu-theme="dark"] {
      color-scheme: dark;
      --teal: #43d2d7;
      --green: #20c86b;
      --ink: #edf5ff;
      --muted: #aab8ca;
      --line: #304761;
      --surface: #152942;
      background:
        radial-gradient(circle at 8% 0%, rgba(202, 239, 112, .09), transparent 28%),
        radial-gradient(circle at 96% 26%, rgba(40, 192, 202, .16), transparent 27%),
        #0b1728;
    }

    body[data-menu-theme="dark"] .menu-stage {
      background:
        radial-gradient(circle at 8% 0%, rgba(202, 239, 112, .09), transparent 28%),
        radial-gradient(circle at 96% 26%, rgba(40, 192, 202, .16), transparent 27%),
        #0b1728;
    }

    button,
    input { font: inherit; }

    .menu-stage {
      width: min(100%, 1280px);
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    body[data-menu-layout="horizontal"] .menu-stage {
      width: 100%;
      max-width: none;
    }

    .menu-header {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      min-height: 142px;
      padding: 24px 30px;
      background: linear-gradient(125deg, #111f36 0%, #172d4b 65%, #087f8d 155%);
      color: #ffffff;
      box-shadow: 0 14px 34px rgba(14, 31, 54, .18);
    }

    .menu-header::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -110px;
      width: 300px;
      height: 300px;
      border: 48px solid rgba(202, 239, 112, .08);
      border-radius: 50%;
    }

    .menu-brand {
      position: relative;
      z-index: 1;
      width: 160px;
      height: 88px;
      display: grid;
      place-items: center;
      padding: 10px 15px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
    }

    .menu-brand img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .menu-heading {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .menu-kicker {
      display: block;
      margin-bottom: 3px;
      color: var(--lime);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .14em;
    }

    .menu-heading h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .menu-heading p {
      margin: 8px 0 0;
      color: #c9d4e1;
      font-size: 16px;
      font-weight: 750;
    }

    .menu-clock {
      min-width: 130px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      text-align: right;
      backdrop-filter: blur(8px);
    }

    .menu-clock strong,
    .menu-clock span { display: block; }

    .menu-clock strong {
      color: #ffffff;
      font-size: 20px;
      letter-spacing: -.03em;
    }

    .menu-clock span {
      margin-top: 2px;
      color: #c9d4e1;
      font-size: 11px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .menu-header-tools {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: end;
      gap: 8px;
    }

    .menu-view-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(8px);
    }

    .menu-view-btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #d7e1ec;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    .menu-view-btn:hover,
    .menu-view-btn.active {
      background: var(--lime);
      color: #29420b;
    }

    .menu-view-btn:focus-visible {
      outline: 3px solid rgba(202, 239, 112, .42);
      outline-offset: 2px;
    }

    .menu-view-icon {
      font-size: 17px;
      line-height: 1;
    }

    .menu-control-clock {
      min-height: 36px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      color: #ffffff;
      background: rgba(255, 255, 255, .1);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    body[data-menu-layout="vertical"] .menu-control-clock {
      display: inline-flex;
    }

    .menu-control-clock-icon {
      color: var(--lime);
      font-size: 15px;
      line-height: 1;
    }

    .menu-control-clock strong {
      font-size: 12px;
      letter-spacing: .02em;
    }

    .menu-board {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(var(--menu-columns), minmax(0, 1fr));
      align-items: start;
      gap: 16px;
      padding: 20px 24px 16px;
    }

    .menu-column {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .menu-category {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(18, 64, 77, .12);
      border-radius: 18px;
      background: rgba(255, 255, 255, .91);
      box-shadow: 0 12px 28px rgba(22, 49, 62, .07);
    }

    .menu-category-head {
      min-height: var(--menu-category-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, #eef9d2, #f8fcef 62%, #ffffff);
    }

    .menu-category-head h2 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #1d3d25;
      font-size: 21px;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-category-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .menu-category-title small {
      color: #7c875f;
      font-size: 8px;
      font-weight: 850;
      letter-spacing: .02em;
    }

    .menu-category-head > span {
      flex: 0 0 auto;
      color: #668021;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .menu-products {
      display: grid;
      gap: 1px;
      background: var(--line);
    }

    .menu-product {
      position: relative;
      min-width: 0;
      min-height: var(--menu-product-height);
      height: var(--menu-product-height);
      display: grid;
      grid-template-columns: var(--menu-image-size) minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 8px 13px 8px 9px;
      background: #ffffff;
    }

    .menu-product.is-featured {
      background: linear-gradient(90deg, #f2fbdb 0%, #ffffff 56%);
    }

    .menu-product.is-featured::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: linear-gradient(180deg, var(--green), var(--teal));
    }

    .menu-product-image {
      width: var(--menu-image-size);
      height: var(--menu-image-size);
      overflow: hidden;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #f2f7f8;
      color: var(--teal);
      font-size: 24px;
      font-weight: 950;
    }

    .menu-product-image img {
      width: 100%;
      height: 100%;
      display: block;
      padding: 3px;
      object-fit: contain;
      background: #ffffff;
    }

    .menu-product-copy {
      min-width: 0;
    }

    .menu-product-copy h3 {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: var(--menu-name-size);
      line-height: 1.18;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body[data-menu-layout="vertical"] .menu-product-copy h3 {
      display: -webkit-box;
      overflow: hidden;
      text-overflow: clip;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .menu-product-price {
      flex: 0 0 auto;
      color: var(--teal);
      font-size: var(--menu-price-size);
      font-weight: 1000;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .menu-footer {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 25px 13px;
      color: #6b778b;
      font-size: 10px;
      font-weight: 850;
    }

    .menu-mobile-categories {
      display: none;
    }

    .menu-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .menu-live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(8, 173, 86, .12);
    }

    .menu-state {
      grid-column: 1 / -1;
      min-height: 430px;
      display: grid;
      place-items: center;
      padding: 30px;
      border: 1px dashed #bdcdd2;
      border-radius: 20px;
      background: rgba(255, 255, 255, .72);
      color: var(--muted);
      text-align: center;
    }

    .menu-state strong,
    .menu-state span { display: block; }

    .menu-state strong {
      color: var(--ink);
      font-size: 24px;
    }

    .menu-state span {
      margin-top: 7px;
      font-weight: 700;
    }

    body[data-menu-theme="dark"] .menu-category {
      border-color: rgba(115, 191, 201, .2);
      background: rgba(21, 41, 66, .96);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .24);
    }

    body[data-menu-theme="dark"] .menu-category-head {
      background: linear-gradient(90deg, #293e31, #213b3e 62%, #172b44);
    }

    body[data-menu-theme="dark"] .menu-category-head h2 { color: #e1f8b9; }
    body[data-menu-theme="dark"] .menu-category-title small { color: #adbd9b; }
    body[data-menu-theme="dark"] .menu-category-head > span { color: #ccec78; }
    body[data-menu-theme="dark"] .menu-product { background: var(--surface); }

    body[data-menu-theme="dark"] .menu-product.is-featured {
      background: linear-gradient(90deg, #233d36 0%, var(--surface) 60%);
    }

    body[data-menu-theme="dark"] .menu-product-image {
      background: #203752;
    }

    body[data-menu-theme="dark"] .menu-footer { color: #aab8ca; }

    body[data-menu-theme="dark"] .menu-state {
      border-color: #415a74;
      background: rgba(21, 41, 66, .84);
    }

    @media (min-width: 720px) {
      html,
      body { overflow: hidden; }

      .menu-stage { height: 100svh; }

      .menu-board {
        min-height: 0;
        overflow: hidden;
      }

      body[data-menu-layout="vertical"] .menu-header {
        min-height: 108px;
        gap: 18px;
        padding: 14px 22px;
      }

      body[data-menu-layout="vertical"] .menu-brand {
        width: 132px;
        height: 70px;
        padding: 8px 12px;
        border-radius: 14px;
      }

      body[data-menu-layout="vertical"] .menu-heading h1 { font-size: 42px; }

      body[data-menu-layout="vertical"] .menu-heading p {
        margin-top: 5px;
        font-size: 13px;
      }

      body[data-menu-layout="vertical"] .menu-kicker { font-size: 10px; }

      body[data-menu-layout="vertical"] .menu-header-tools { gap: 5px; }

      body[data-menu-layout="vertical"] .menu-view-controls {
        gap: 4px;
        padding: 4px;
      }

      body[data-menu-layout="vertical"] .menu-view-btn {
        min-height: 30px;
        gap: 4px;
        padding: 5px 8px;
        font-size: 9px;
      }

      body[data-menu-layout="vertical"] .menu-view-icon { font-size: 14px; }

      body[data-menu-layout="vertical"] .menu-clock { display: none; }
    }

    @media (min-width: 720px) and (min-height: 1500px) and (orientation: portrait) {
      .menu-category-head {
        min-height: 54px;
        padding-block: 13px;
      }
    }

    @media (min-width: 720px) and (orientation: landscape) {
      body[data-menu-layout="vertical"] .menu-stage {
        position: fixed;
        inset: 0 auto auto 0;
        width: 100vh;
        height: 100vw;
        min-height: 0;
        transform: translateY(100vh) rotate(-90deg);
        transform-origin: top left;
      }

      body[data-menu-layout="horizontal"] .menu-header {
        min-height: 112px;
        gap: 18px;
        padding: 15px 24px;
      }

      body[data-menu-layout="horizontal"] .menu-brand {
        width: 136px;
        height: 72px;
        border-radius: 14px;
      }

      body[data-menu-layout="horizontal"] .menu-heading h1 {
        font-size: 44px;
      }

      body[data-menu-layout="horizontal"] .menu-heading p {
        margin-top: 5px;
        font-size: 13px;
      }

      body[data-menu-layout="horizontal"] .menu-board {
        gap: 12px;
        padding: 12px 18px 10px;
      }

      body[data-menu-layout="horizontal"] .menu-column {
        gap: 10px;
      }

      body[data-menu-layout="horizontal"] .menu-category {
        border-radius: 14px;
      }

      body[data-menu-layout="horizontal"] .menu-category-head h2 {
        font-size: 18px;
      }

      body[data-menu-layout="horizontal"] .menu-footer {
        min-height: 36px;
        padding-block: 7px 9px;
      }
    }

    @media (min-width: 720px) and (max-height: 899px) and (orientation: landscape) {
      body[data-menu-layout="vertical"] .menu-header {
        grid-template-columns: 92px minmax(0, 1fr) auto;
        min-height: 84px;
        gap: 10px;
        padding: 8px 12px;
      }

      body[data-menu-layout="vertical"] .menu-brand {
        width: 92px;
        height: 54px;
        padding: 6px 9px;
        border-radius: 11px;
      }

      body[data-menu-layout="vertical"] .menu-heading h1 {
        font-size: 30px;
        line-height: .94;
      }

      body[data-menu-layout="vertical"] .menu-heading p { display: none; }

      body[data-menu-layout="vertical"] .menu-kicker {
        margin-bottom: 2px;
        font-size: 8px;
      }

      body[data-menu-layout="vertical"] .menu-header-tools {
        min-width: 0;
        gap: 0;
      }

      body[data-menu-layout="vertical"] .menu-view-controls {
        gap: 3px;
        padding: 3px;
        border-radius: 10px;
      }

      body[data-menu-layout="vertical"] .menu-view-btn {
        position: relative;
        width: 29px;
        min-width: 29px;
        min-height: 29px;
        flex: 0 0 29px;
        padding: 0;
        border-radius: 7px;
      }

      body[data-menu-layout="vertical"] .menu-view-btn .menu-view-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body[data-menu-layout="vertical"] .menu-view-icon { font-size: 15px; }

      body[data-menu-layout="vertical"] .menu-control-clock {
        min-height: 29px;
        padding: 0 9px;
        font-size: 10px;
      }
    }

    @media (max-width: 719px) {
      .menu-stage { min-height: 100svh; }

      .menu-header {
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 13px;
        min-height: 108px;
        padding: 15px;
      }

      .menu-brand {
        width: 88px;
        height: 62px;
        padding: 8px;
        border-radius: 12px;
      }

      .menu-heading h1 { font-size: 30px; }
      .menu-heading p { font-size: 11px; }
      .menu-kicker { font-size: 9px; }
      .menu-clock { display: none; }

      .menu-header-tools {
        grid-column: 1 / -1;
        width: 100%;
        justify-items: stretch;
      }

      .menu-view-controls {
        width: 100%;
        flex-wrap: wrap;
      }

      .menu-view-btn {
        flex: 1 1 calc(33.333% - 6px);
      }

      .menu-board {
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        padding: 12px 10px;
      }

      .menu-column { gap: 10px; }
      .menu-category { border-radius: 14px; }
      .menu-category-head h2 { font-size: 18px; }

      .menu-product {
        min-height: 78px;
        height: auto;
        grid-template-columns: 62px minmax(0, 1fr) auto;
        gap: 9px;
        padding: 7px 10px 7px 7px;
      }

      .menu-product-image {
        width: 62px;
        height: 62px;
        border-radius: 10px;
      }

      .menu-product-copy h3 {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .menu-product-price { font-size: 19px; }
      .menu-footer { padding-inline: 12px; }
    }

    html[data-menu-display="mobile"] {
      scroll-behavior: smooth;
      scroll-padding-top: 126px;
    }

    html[data-menu-display="mobile"],
    html[data-menu-display="mobile"] body {
      min-height: 100%;
      overflow: visible;
    }

    html[data-menu-display="mobile"] .menu-stage {
      width: 100%;
      max-width: 620px;
      min-height: 100svh;
      grid-template-rows: auto auto 1fr auto;
      background: rgba(246, 250, 250, .96);
      box-shadow: 0 0 44px rgba(20, 44, 58, .12);
    }

    html[data-menu-display="mobile"] body[data-menu-theme="dark"] .menu-stage {
      background: #0b1728;
    }

    html[data-menu-display="mobile"] .menu-header {
      position: sticky;
      top: 0;
      z-index: 30;
      grid-template-columns: 62px minmax(0, 1fr) auto;
      min-height: 82px;
      gap: 11px;
      padding: max(9px, env(safe-area-inset-top)) 12px 9px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(14, 31, 54, .16);
    }

    html[data-menu-display="mobile"] .menu-header::after {
      right: -90px;
      bottom: -145px;
      width: 250px;
      height: 250px;
    }

    html[data-menu-display="mobile"] .menu-brand {
      width: 62px;
      height: 54px;
      padding: 6px;
      border-radius: 11px;
    }

    html[data-menu-display="mobile"] .menu-kicker {
      margin-bottom: 1px;
      font-size: 8px;
    }

    html[data-menu-display="mobile"] .menu-heading h1 {
      font-size: 25px;
      line-height: 1;
    }

    html[data-menu-display="mobile"] .menu-heading p,
    html[data-menu-display="mobile"] .menu-clock,
    html[data-menu-display="mobile"] .menu-view-btn[data-menu-layout],
    html[data-menu-display="mobile"] #menuFullscreenBtn,
    html[data-menu-display="mobile"] .menu-control-clock {
      display: none;
    }

    html[data-menu-display="mobile"] .menu-header-tools {
      grid-column: auto;
      width: auto;
      justify-items: end;
    }

    html[data-menu-display="mobile"] .menu-view-controls {
      width: auto;
      flex-wrap: nowrap;
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
    }

    html[data-menu-display="mobile"] .menu-view-btn[data-menu-theme] {
      position: relative;
      min-width: 33px;
      min-height: 33px;
      flex: 0 0 33px;
      padding: 0;
    }

    html[data-menu-display="mobile"] .menu-view-btn[data-menu-theme] .menu-view-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html[data-menu-display="mobile"] .menu-mobile-categories {
      position: sticky;
      top: 82px;
      z-index: 20;
      display: flex;
      gap: 7px;
      padding: 8px 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 250, 250, .96);
      box-shadow: 0 5px 14px rgba(20, 44, 58, .07);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    html[data-menu-display="mobile"] .menu-mobile-categories::-webkit-scrollbar {
      display: none;
    }

    html[data-menu-display="mobile"] body[data-menu-theme="dark"] .menu-mobile-categories {
      background: rgba(11, 23, 40, .96);
    }

    .menu-mobile-category-link {
      flex: 0 0 auto;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .menu-mobile-category-link:first-child {
      border-color: #a8d84f;
      background: #eaf8c8;
      color: #355509;
    }

    html[data-menu-display="mobile"] .menu-board {
      min-height: 0;
      display: block;
      padding: 10px;
      overflow: visible;
    }

    html[data-menu-display="mobile"] .menu-column {
      display: grid;
      gap: 10px;
    }

    html[data-menu-display="mobile"] .menu-category {
      scroll-margin-top: 132px;
      border-radius: 15px;
      box-shadow: 0 7px 18px rgba(22, 49, 62, .07);
    }

    html[data-menu-display="mobile"] .menu-category-head {
      min-height: 45px;
      padding: 9px 12px;
    }

    html[data-menu-display="mobile"] .menu-category-head h2 {
      font-size: 18px;
    }

    html[data-menu-display="mobile"] .menu-category-head > span {
      font-size: 9px;
    }

    html[data-menu-display="mobile"] .menu-product {
      min-height: 76px;
      height: 76px;
      grid-template-columns: 60px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 7px 10px 7px 7px;
    }

    html[data-menu-display="mobile"] .menu-product-image {
      width: 60px;
      height: 60px;
      border-radius: 10px;
    }

    html[data-menu-display="mobile"] .menu-product-copy h3 {
      display: -webkit-box;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.16;
      text-overflow: clip;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    html[data-menu-display="mobile"] .menu-product-price {
      font-size: 18px;
    }

    html[data-menu-display="mobile"] .menu-footer {
      min-height: 42px;
      padding: 9px 12px max(11px, env(safe-area-inset-bottom));
      font-size: 9px;
    }

    @media (max-width: 374px) {
      html[data-menu-display="mobile"] .menu-heading h1 { font-size: 22px; }
      html[data-menu-display="mobile"] .menu-product { grid-template-columns: 54px minmax(0, 1fr) auto; }
      html[data-menu-display="mobile"] .menu-product-image { width: 54px; height: 54px; }
      html[data-menu-display="mobile"] .menu-product-copy h3 { font-size: 14px; }
      html[data-menu-display="mobile"] .menu-product-price { font-size: 16px; }
    }
  </style>
</head>
<body data-menu-theme="light">
  <div class="menu-stage">
    <header class="menu-header">
      <div class="menu-brand"><img src="../logo.png" alt="Ilha Tênis" /></div>
      <div class="menu-heading">
        <span class="menu-kicker">ILHA BAR</span>
        <h1>Cardápio</h1>
        <p>Escolha seu pedido e aproveite.</p>
      </div>
      <div class="menu-header-tools">
        <div class="menu-view-controls" aria-label="Formato de visualização">
          <button class="menu-view-btn" type="button" data-menu-layout="vertical" aria-label="Visualização vertical" title="Vertical" aria-pressed="false"><span class="menu-view-icon" aria-hidden="true">▯</span><span class="menu-view-label">Vertical</span></button>
          <button class="menu-view-btn" type="button" data-menu-layout="horizontal" aria-label="Visualização horizontal" title="Horizontal" aria-pressed="false"><span class="menu-view-icon" aria-hidden="true">▭</span><span class="menu-view-label">Horizontal</span></button>
          <button class="menu-view-btn" type="button" data-menu-theme="light" aria-label="Tema claro" title="Tema claro" aria-pressed="false"><span class="menu-view-icon" aria-hidden="true">☀</span><span class="menu-view-label">Claro</span></button>
          <button class="menu-view-btn" type="button" data-menu-theme="dark" aria-label="Tema escuro" title="Tema escuro" aria-pressed="false"><span class="menu-view-icon" aria-hidden="true">◐</span><span class="menu-view-label">Escuro</span></button>
          <button class="menu-view-btn" type="button" id="menuFullscreenBtn" aria-label="Ativar tela cheia" title="Tela cheia" aria-pressed="false"><span class="menu-view-icon" aria-hidden="true">⛶</span><span class="menu-view-label" id="menuFullscreenLabel">Tela cheia</span></button>
          <span class="menu-control-clock" aria-label="Hora atual"><span class="menu-control-clock-icon" aria-hidden="true">◷</span><strong id="menuControlClock">--:--</strong></span>
        </div>
        <div class="menu-clock" aria-label="Data e hora"><strong id="menuClock">--:--</strong><span id="menuDate">Carregando...</span></div>
      </div>
    </header>

    <nav class="menu-mobile-categories" id="menuMobileCategories" aria-label="Categorias do cardápio"></nav>

    <main class="menu-board" id="menuBoard" aria-live="polite">
      <div class="menu-state"><div><strong>Carregando o cardápio</strong><span>Os produtos aparecerão em instantes.</span></div></div>
    </main>

    <footer class="menu-footer">
      <span class="menu-live">Cardápio atualizado automaticamente</span>
      <span id="menuUpdatedAt">Conectando...</span>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      const SUPABASE_URL = 'https://lkqtgptebkgfwguykxhv.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcXRncHRlYmtnZndndXlreGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzEyNjAsImV4cCI6MjA5NzcwNzI2MH0.S-dopp-fbBgq8_YclyiAheOdK-QhXt92RYLu8JKmKCg';
      const MENU_QUERY = 'bar_products?select=id,name,category,sale_price,image_url,menu_featured,menu_sort_order,updated_at&active=eq.true&menu_visible=eq.true&order=category.asc,menu_sort_order.asc,name.asc';
      const MENU_REFRESH_INTERVAL = 10000;
      const CATEGORY_PRIORITY = ['almocos', 'cervejas', 'porcoes', 'lanches', 'refrigerantes', 'aguas', 'bebidas'];
      const LAYOUT_KEY = 'ilha-menu-layout-v1';
      const THEME_KEY = 'ilha-menu-theme-v1';
      const MOBILE_MENU_VIEW = new URLSearchParams(window.location.search).get('view') === 'mobile';
      let lastPayload = '';
      let refreshInFlight = false;
      let currentProducts = [];
      let resizeTimer = 0;

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>'"]/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char];
        });
      }

      function normalize(value) {
        return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      }

      function money(value) {
        return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      function imageSource(value) {
        const source = String(value || '').trim();
        if (!source) return '';
        try {
          const url = new URL(source, window.location.origin);
          if (url.hostname === 'app.ilhatenis.com' && url.pathname.startsWith('/assets/bar-products/')) return url.pathname + url.search;
          return url.href;
        } catch (error) {
          return source;
        }
      }

      function categoryRank(category) {
        const normalized = normalize(category);
        const index = CATEGORY_PRIORITY.findIndex(function (entry) { return normalized.includes(entry); });
        return index < 0 ? 99 : index;
      }

      function groupProducts(products) {
        const groups = new Map();
        products.forEach(function (product) {
          const category = product.category || 'Outros';
          if (!groups.has(category)) groups.set(category, []);
          groups.get(category).push(product);
        });
        return Array.from(groups.entries()).map(function (entry) {
          return { category: entry[0], products: entry[1] };
        });
      }

      function categoryId(category) {
        const id = normalize(category).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return 'categoria-' + (id || 'outros');
      }

      function sortedGroups(products) {
        return groupProducts(products).sort(function (a, b) {
          return categoryRank(a.category) - categoryRank(b.category) || a.category.localeCompare(b.category, 'pt-BR');
        });
      }

      function renderMobileCategories(groups) {
        const navigation = document.getElementById('menuMobileCategories');
        if (!MOBILE_MENU_VIEW) {
          navigation.innerHTML = '';
          return;
        }
        navigation.innerHTML = groups.map(function (group) {
          return '<a class="menu-mobile-category-link" href="#' + categoryId(group.category) + '">' + escapeHtml(group.category) + '</a>';
        }).join('');
      }

      function distributeGroups(groups, columnCount) {
        const columns = Array.from({ length: columnCount }, function () { return []; });
        const heights = Array.from({ length: columnCount }, function () { return 0; });
        groups.slice().sort(function (a, b) {
          return b.products.length - a.products.length || categoryRank(a.category) - categoryRank(b.category);
        }).forEach(function (group) {
          const columnIndex = heights.indexOf(Math.min.apply(Math, heights));
          columns[columnIndex].push(group);
          heights[columnIndex] += group.products.length * 92 + 54;
        });
        columns.forEach(function (column) {
          column.sort(function (a, b) {
            return categoryRank(a.category) - categoryRank(b.category) || a.category.localeCompare(b.category, 'pt-BR');
          });
        });
        return columns;
      }

      function initialMenuLayout() {
        if (MOBILE_MENU_VIEW) return 'vertical';
        const requestedLayout = new URLSearchParams(window.location.search).get('layout');
        if (requestedLayout === 'vertical' || requestedLayout === 'horizontal') return requestedLayout;
        try {
          const saved = localStorage.getItem(LAYOUT_KEY);
          if (saved === 'vertical' || saved === 'horizontal') return saved;
        } catch (error) {}
        return 'vertical';
      }

      function setMenuLayout(layout, persist) {
        const nextLayout = layout === 'horizontal' ? 'horizontal' : 'vertical';
        document.body.dataset.menuLayout = nextLayout;
        document.querySelectorAll('[data-menu-layout]').forEach(function (button) {
          const active = button.dataset.menuLayout === nextLayout;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        if (persist !== false) {
          try { localStorage.setItem(LAYOUT_KEY, nextLayout); } catch (error) {}
        }
        if (currentProducts.length) render(currentProducts);
      }

      function initialMenuTheme() {
        const requestedTheme = new URLSearchParams(window.location.search).get('theme');
        if (requestedTheme === 'light' || requestedTheme === 'dark') return requestedTheme;
        try {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (error) {}
        return 'light';
      }

      function setMenuTheme(theme, persist) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        document.body.dataset.menuTheme = nextTheme;
        document.querySelectorAll('button[data-menu-theme]').forEach(function (button) {
          const active = button.dataset.menuTheme === nextTheme;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        if (persist !== false) {
          try { localStorage.setItem(THEME_KEY, nextTheme); } catch (error) {}
        }
        requestAnimationFrame(fitMenuToViewport);
      }

      function applyMenuDensity(rowHeight, layout) {
        const root = document.documentElement;
        const imageMax = layout === 'horizontal' ? 72 : 98;
        const imageSize = Math.max(34, Math.min(imageMax, rowHeight - 20));
        const nameSize = rowHeight < 62 ? 11 : rowHeight < 76 ? 13 : layout === 'horizontal' ? 15 : 18;
        const priceSize = rowHeight < 62 ? 14 : rowHeight < 76 ? 17 : layout === 'horizontal' ? 20 : 25;
        root.style.setProperty('--menu-product-height', Math.floor(rowHeight) + 'px');
        root.style.setProperty('--menu-image-size', Math.floor(imageSize) + 'px');
        root.style.setProperty('--menu-name-size', nameSize + 'px');
        root.style.setProperty('--menu-price-size', priceSize + 'px');
      }

      function fitMenuToViewport() {
        const root = document.documentElement;
        if (MOBILE_MENU_VIEW || window.innerWidth < 720) {
          ['--menu-product-height', '--menu-image-size', '--menu-name-size', '--menu-price-size', '--menu-category-height'].forEach(function (property) {
            root.style.removeProperty(property);
          });
          return;
        }
        const board = document.getElementById('menuBoard');
        const columns = Array.from(board.querySelectorAll('.menu-column'));
        if (!columns.length) return;
        const layout = document.body.dataset.menuLayout === 'horizontal' ? 'horizontal' : 'vertical';
        const stageHeight = document.querySelector('.menu-stage').clientHeight;
        const maxRowHeight = layout === 'horizontal' ? 92 : (stageHeight >= 1500 ? 124 : 96);
        const categoryHeight = layout === 'horizontal' ? 44 : (stageHeight >= 1500 ? 54 : 48);
        root.style.setProperty('--menu-category-height', categoryHeight + 'px');
        let rowHeight = maxRowHeight;
        applyMenuDensity(rowHeight, layout);

        for (let attempt = 0; attempt < 8; attempt += 1) {
          const boardStyle = window.getComputedStyle(board);
          const availableHeight = board.clientHeight - parseFloat(boardStyle.paddingTop) - parseFloat(boardStyle.paddingBottom);
          const contentHeight = Math.max.apply(Math, columns.map(function (column) { return column.scrollHeight; }));
          const overflow = Math.ceil(contentHeight - availableHeight);
          if (overflow <= 0) break;
          const busiestColumn = Math.max.apply(Math, columns.map(function (column) { return column.querySelectorAll('.menu-product').length || 1; }));
          rowHeight = Math.max(48, rowHeight - Math.max(2, Math.ceil(overflow / busiestColumn) + 1));
          applyMenuDensity(rowHeight, layout);
        }
      }

      function productHtml(product) {
        const source = imageSource(product.image_url);
        const initial = escapeHtml(String(product.name || 'P').trim().charAt(0).toUpperCase() || 'P');
        const image = source
          ? '<img src="' + escapeHtml(source) + '" alt="' + escapeHtml(product.name) + '" decoding="async" loading="eager" />'
          : '<span>' + initial + '</span>';
        return '<article class="menu-product' + (product.menu_featured ? ' is-featured' : '') + '">' +
          '<div class="menu-product-image" data-menu-fallback="' + initial + '">' + image + '</div>' +
          '<div class="menu-product-copy"><h3>' + escapeHtml(product.name) + '</h3></div>' +
          '<strong class="menu-product-price">' + money(product.sale_price) + '</strong>' +
        '</article>';
      }

      function categoryHtml(group) {
        const illustrativeNote = normalize(group.category).includes('porc')
          ? '<small>Imagens meramente ilustrativas</small>'
          : '';
        const countLabel = group.products.length + (group.products.length === 1 ? ' opção' : ' opções');
        return '<section class="menu-category" id="' + categoryId(group.category) + '"><header class="menu-category-head"><div class="menu-category-title"><h2>' + escapeHtml(group.category) + '</h2>' + illustrativeNote + '</div><span>' + countLabel + '</span></header><div class="menu-products">' + group.products.map(productHtml).join('') + '</div></section>';
      }

      function render(products) {
        const board = document.getElementById('menuBoard');
        if (!products.length) {
          renderMobileCategories([]);
          board.innerHTML = '<div class="menu-state"><div><strong>Cardápio em atualização</strong><span>Nenhum produto está publicado neste momento.</span></div></div>';
          return;
        }
        currentProducts = products.slice();
        const groups = sortedGroups(products);
        renderMobileCategories(groups);
        const isDesktop = !MOBILE_MENU_VIEW && window.innerWidth >= 720;
        const columnCount = isDesktop ? (document.body.dataset.menuLayout === 'horizontal' ? 3 : 2) : 1;
        document.documentElement.style.setProperty('--menu-columns', columnCount);
        const columns = columnCount === 1 ? [groups] : distributeGroups(groups, columnCount);
        board.innerHTML = columns.map(function (groups) {
          return '<div class="menu-column">' + groups.map(categoryHtml).join('') + '</div>';
        }).join('');
        board.querySelectorAll('.menu-product-image img').forEach(function (image) {
          image.addEventListener('error', function () {
            const container = image.parentElement;
            container.innerHTML = '<span>' + escapeHtml(container.dataset.menuFallback || 'P') + '</span>';
          }, { once: true });
        });
        requestAnimationFrame(fitMenuToViewport);
      }

      async function loadMenu() {
        if (refreshInFlight) return;
        refreshInFlight = true;
        try {
          const response = await fetch(SUPABASE_URL + '/rest/v1/' + MENU_QUERY, {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: 'Bearer ' + SUPABASE_ANON_KEY
            },
            cache: 'no-store'
          });
          if (!response.ok) throw new Error('Não foi possível carregar o cardápio.');
          const products = await response.json();
          const payload = JSON.stringify(products);
          if (payload !== lastPayload) {
            lastPayload = payload;
            render(products);
          }
          document.getElementById('menuUpdatedAt').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        } catch (error) {
          if (!lastPayload) {
            document.getElementById('menuBoard').innerHTML = '<div class="menu-state"><div><strong>Conexão temporariamente indisponível</strong><span>O cardápio tentará carregar novamente sozinho.</span></div></div>';
          }
          document.getElementById('menuUpdatedAt').textContent = 'Tentando reconectar...';
        } finally {
          refreshInFlight = false;
        }
      }

      function updateClock() {
        const now = new Date();
        const timeLabel = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('menuClock').textContent = timeLabel;
        document.getElementById('menuControlClock').textContent = timeLabel;
        document.getElementById('menuDate').textContent = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
      }

      function syncFullscreenButton() {
        const active = Boolean(document.fullscreenElement);
        document.getElementById('menuFullscreenBtn').setAttribute('aria-pressed', String(active));
        document.getElementById('menuFullscreenLabel').textContent = active ? 'Sair da tela' : 'Tela cheia';
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        } catch (error) {}
        syncFullscreenButton();
      }

      if (MOBILE_MENU_VIEW) {
        document.body.dataset.menuDisplay = 'mobile';
        document.title = 'Cardápio Online | Ilha Bar';
      }
      setMenuTheme(initialMenuTheme(), false);
      setMenuLayout(initialMenuLayout(), false);
      document.querySelectorAll('[data-menu-layout]').forEach(function (button) {
        button.addEventListener('click', function () { setMenuLayout(button.dataset.menuLayout); });
      });
      document.querySelectorAll('button[data-menu-theme]').forEach(function (button) {
        button.addEventListener('click', function () { setMenuTheme(button.dataset.menuTheme); });
      });
      document.getElementById('menuFullscreenBtn').addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', function () {
        syncFullscreenButton();
        requestAnimationFrame(fitMenuToViewport);
      });
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (currentProducts.length) render(currentProducts);
        }, 120);
      });
      updateClock();
      loadMenu();
      setInterval(updateClock, 1000);
      setInterval(function () {
        if (!document.hidden) loadMenu();
      }, MENU_REFRESH_INTERVAL);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) loadMenu();
      });
      window.addEventListener('focus', loadMenu);
      window.addEventListener('online', loadMenu);
    })();
  </script>
</body>
</html>
