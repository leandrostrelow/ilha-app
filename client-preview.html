<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Visualização do Ilha Play</title>
  <style>
    :root {
      --ink: #102f37;
      --navy: #172740;
      --teal: #087f89;
      --lime: #b9ef00;
      --lime-soft: #e8f9a9;
      --muted: #667984;
      --line: #d9e5e8;
      --surface: #ffffff;
      --background: #f2f6f5;
      --warning: #fff3d6;
      --warning-ink: #76520b;
      --danger: #9f2424;
      --shadow: 0 18px 45px rgba(23, 50, 59, .10);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 10%, rgba(185, 239, 0, .13), transparent 24rem),
        linear-gradient(180deg, #ffffff 0 180px, var(--background) 180px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid rgba(8, 127, 137, .25); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .readonly-bar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 16px;
      color: #ffffff;
      background: var(--navy);
      font-size: 12px;
      font-weight: 850;
      text-align: center;
    }

    .readonly-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }

    .app-shell {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 0 24px 120px;
    }

    .topbar {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 0;
    }

    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand img { width: min(255px, 48vw); max-height: 72px; object-fit: contain; object-position: left center; }
    .brand-copy { padding-left: 16px; border-left: 1px solid var(--line); }
    .brand-copy strong { display: block; color: #52656d; font-size: 20px; letter-spacing: .18em; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--teal); font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }

    .icon-button {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: #ffffff;
      cursor: pointer;
    }

    .page { display: none; animation: page-in .18s ease; }
    .page.active { display: block; }
    @keyframes page-in { from { opacity: .45; transform: translateY(4px); } }

    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 10px 0 18px; }
    .page-head h1 { margin: 0; color: var(--ink); font-size: clamp(27px, 4vw, 42px); letter-spacing: -.04em; }
    .page-head p { margin: 5px 0 0; color: var(--muted); font-size: 14px; font-weight: 650; }

    .status-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid #ecd08b;
      border-radius: 16px;
      color: var(--warning-ink);
      background: var(--warning);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.45;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .plan-card, .play-card, .card, .list-card, .product-card, .profile-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .plan-card {
      min-height: 200px;
      display: grid;
      align-content: space-between;
      padding: 26px;
      overflow: hidden;
      color: #ffffff;
      background: linear-gradient(135deg, #123e48, #0a6972);
    }

    .eyebrow { color: #bed5d8; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .plan-card h2 { margin: 9px 0 5px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.035em; }
    .plan-card p { margin: 0; color: #d6e5e7; font-weight: 650; }
    .plan-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .plan-meta span { padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 11px; font-weight: 850; }

    .play-card { overflow: hidden; background: var(--lime); box-shadow: var(--shadow); }
    .play-action {
      width: 100%;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-size: 21px;
      font-weight: 950;
      text-align: left;
      cursor: pointer;
    }
    .play-action b { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; color: var(--lime); background: var(--ink); }
    .next-booking { min-height: 104px; padding: 18px 22px; border-top: 1px solid rgba(16,47,55,.13); background: rgba(255,255,255,.5); }
    .next-booking span, .next-booking strong { display: block; }
    .next-booking span { color: #526c72; font-size: 12px; font-weight: 850; }
    .next-booking strong { margin-top: 5px; font-size: 18px; }

    .shortcut-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
    .shortcut {
      min-height: 128px;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
    }
    .shortcut span:first-child { font-size: 25px; }
    .shortcut strong { font-size: 17px; }
    .shortcut small { color: var(--muted); font-weight: 700; }

    .section-title { margin: 26px 0 12px; font-size: 21px; letter-spacing: -.02em; }
    .card { padding: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .list { display: grid; gap: 10px; }
    .list-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px 18px; box-shadow: none; }
    .list-card strong, .list-card span, .list-card small { display: block; }
    .list-card strong { font-size: 16px; }
    .list-card span, .list-card small { margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .list-value { color: var(--ink) !important; font-size: 15px !important; font-weight: 900 !important; text-align: right; }

    .pill { display: inline-flex !important; width: max-content; margin-top: 8px !important; padding: 5px 8px; border-radius: 999px; color: #476204 !important; background: #edf8c6; font-size: 10px !important; font-weight: 900 !important; text-transform: uppercase; }
    .pill.warn { color: #855d08 !important; background: #fff0c7; }
    .pill.bad { color: #9b2020 !important; background: #ffe1e1; }

    .readonly-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #52656d; font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .field input, .field select {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: #708087;
      background: #f3f6f6;
      font: inherit;
      font-weight: 700;
    }

    .empty { padding: 30px 20px; border: 1px dashed #bfd0d4; border-radius: 18px; color: var(--muted); background: rgba(255,255,255,.65); font-weight: 700; text-align: center; }

    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .product-card { overflow: hidden; box-shadow: none; }
    .product-card img { width: 100%; height: 180px; display: block; object-fit: cover; background: #e8efef; }
    .product-copy { padding: 16px; }
    .product-copy strong { display: block; }
    .product-copy p { min-height: 34px; margin: 6px 0 12px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .product-copy b { color: var(--teal); font-size: 18px; }

    .profile-layout { display: grid; grid-template-columns: minmax(280px, .7fr) minmax(0, 1.3fr); gap: 14px; }
    .profile-card { padding: 22px; box-shadow: none; }
    .profile-avatar { width: 76px; height: 76px; display: grid; place-items: center; margin-bottom: 14px; overflow: hidden; border-radius: 25px; color: #ffffff; background: var(--teal); font-size: 24px; font-weight: 950; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-card h2 { margin: 0; }
    .profile-card > p { margin: 5px 0 0; color: var(--muted); font-weight: 700; overflow-wrap: anywhere; }
    .detail-list { display: grid; gap: 10px; margin-top: 20px; }
    .detail-row { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
    .detail-row span { color: var(--muted); font-size: 12px; font-weight: 750; }
    .detail-row strong { font-size: 13px; text-align: right; }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 20px;
      width: min(920px, calc(100% - 40px));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 0 auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 50px rgba(20,48,56,.19);
      backdrop-filter: blur(16px);
    }

    .bottom-nav button { min-height: 58px; display: grid; place-items: center; gap: 2px; padding: 6px; border: 0; border-radius: 17px; color: #647983; background: transparent; font-size: 11px; font-weight: 850; cursor: pointer; }
    .bottom-nav button.active { color: var(--ink); background: var(--lime-soft); }
    .bottom-nav b { font-size: 19px; }

    .error-state { width: min(620px, calc(100% - 32px)); margin: 12vh auto; padding: 32px; border: 1px solid #efcaca; border-radius: 22px; color: var(--danger); background: #ffffff; box-shadow: var(--shadow); text-align: center; }
    .error-state h1 { margin-top: 0; color: var(--ink); }

    @media (max-width: 800px) {
      .app-shell { padding: 0 16px 112px; }
      .topbar { min-height: 92px; }
      .brand-copy { display: none; }
      .hero, .profile-layout { grid-template-columns: 1fr; }
      .shortcut-grid, .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      body { background: linear-gradient(180deg, #fff 0 150px, var(--background) 150px); }
      .readonly-bar { font-size: 10px; }
      .topbar { min-height: 78px; }
      .brand img { width: 205px; max-height: 54px; }
      .icon-button { width: 46px; height: 46px; border-radius: 15px; }
      .plan-card { min-height: 170px; padding: 21px; }
      .shortcut-grid, .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .shortcut { min-height: 112px; padding: 16px; }
      .product-card img { height: 135px; }
      .readonly-form { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .list-card { grid-template-columns: 1fr; }
      .list-value { text-align: left; }
      .bottom-nav { right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); left: 8px; width: calc(100% - 16px); border-radius: 20px; }
      .bottom-nav button { min-height: 53px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="readonly-bar"><span class="readonly-dot"></span>Visualização pelo ADM · somente leitura · nenhuma alteração será salva</div>
  <div id="previewRoot"></div>

  <script>
    (function () {
      'use strict';

      const rawPayload = window.name;
      window.name = '';
      try { window.opener = null; } catch (_error) {}

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function safeImageUrl(value) {
        const source = String(value || '').trim();
        if (!source) return '';
        if (source.charAt(0) === '/' && source.charAt(1) !== '/') return source;
        try {
          const parsed = new URL(source);
          return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
        } catch (_error) {
          return '';
        }
      }

      function parsePayload() {
        let parsed;
        try { parsed = JSON.parse(rawPayload || ''); } catch (_error) { return null; }
        if (!parsed || parsed.kind !== 'ilha-client-readonly-preview-v1' || !parsed.client) return null;
        if (!Number.isFinite(Number(parsed.expiresAt)) || Number(parsed.expiresAt) < Date.now()) return null;
        return parsed;
      }

      const payload = parsePayload();
      const root = document.getElementById('previewRoot');
      if (!payload) {
        root.innerHTML = '<main class="error-state"><h1>Visualização encerrada</h1><p>Abra novamente a ficha do aluno no ADM e clique em “Abrir área do cliente”.</p></main>';
        return;
      }

      const client = payload.client || {};
      const plan = payload.plan || {};
      const bookings = Array.isArray(payload.bookings) ? payload.bookings : [];
      const lessons = Array.isArray(payload.lessons) ? payload.lessons : [];
      const invoices = Array.isArray(payload.invoices) ? payload.invoices : [];
      const products = Array.isArray(payload.products) ? payload.products : [];
      const announcements = Array.isArray(payload.announcements) ? payload.announcements : [];
      const family = payload.family || { members: [] };

      function digits(value) { return String(value || '').replace(/\D/g, ''); }
      function initials(value) { return String(value || 'Cliente').trim().split(/\s+/).slice(0, 2).map(function (part) { return part.charAt(0); }).join('').toUpperCase(); }
      function firstName(value) { return String(value || 'Cliente').trim().split(/\s+/)[0] || 'Cliente'; }
      function money(value) { return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
      function dateLabel(value) {
        const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        return match ? match[3] + '/' + match[2] + '/' + match[1] : 'Não informado';
      }
      function phoneLabel(value) {
        const number = digits(value).replace(/^55(?=\d{10,11}$)/, '');
        if (number.length === 11) return '(' + number.slice(0, 2) + ') ' + number.slice(2, 7) + '-' + number.slice(7);
        if (number.length === 10) return '(' + number.slice(0, 2) + ') ' + number.slice(2, 6) + '-' + number.slice(6);
        return value || 'Não informado';
      }
      function cpfLabel(value) {
        const number = digits(value);
        return number.length === 11 ? '***.' + number.slice(3, 6) + '.' + number.slice(6, 9) + '-**' : 'Não informado';
      }
      function statusClass(value) {
        const status = String(value || '').toUpperCase();
        if (['VENCIDA', 'VENCIDO', 'BLOQUEADO', 'CANCELADA', 'CANCELADO'].includes(status)) return 'bad';
        if (['PENDENTE', 'ABERTA', 'ABERTO', 'AGUARDANDO_PAGAMENTO'].includes(status)) return 'warn';
        return '';
      }
      function statusPill(value) { return '<span class="pill ' + statusClass(value) + '">' + escapeHtml(String(value || 'A definir').replace(/_/g, ' ')) + '</span>'; }
      function dayLabel(value) {
        const labels = { segunda: 'Segunda-feira', terca: 'Terça-feira', quarta: 'Quarta-feira', quinta: 'Quinta-feira', sexta: 'Sexta-feira', sabado: 'Sábado', domingo: 'Domingo' };
        return labels[String(value || '').toLowerCase()] || value || 'Dia a definir';
      }

      function listOrEmpty(items, renderer, emptyText) {
        return items.length ? '<div class="list">' + items.map(renderer).join('') + '</div>' : '<div class="empty">' + escapeHtml(emptyText) + '</div>';
      }

      function bookingCard(item) {
        return '<article class="list-card"><div><strong>' + escapeHtml(dateLabel(item.date) + ' às ' + (item.time || '--:--')) + '</strong><span>' + escapeHtml((item.court || 'Quadra') + (item.opponent ? ' · com ' + item.opponent : '')) + '</span>' + statusPill(item.status) + '</div><strong class="list-value">' + escapeHtml(item.status || 'CONFIRMADO') + '</strong></article>';
      }

      function lessonCard(item) {
        return '<article class="list-card"><div><strong>' + escapeHtml(dayLabel(item.day) + ' · ' + (item.time || '--:--')) + '</strong><span>' + escapeHtml([item.teacher, item.court, item.level].filter(Boolean).join(' · ') || 'Detalhes a definir') + '</span></div><strong class="list-value">' + escapeHtml(item.type || 'FIXO') + '</strong></article>';
      }

      function invoiceCard(item) {
        return '<article class="list-card"><div><strong>' + escapeHtml(item.description || item.planName || 'Mensalidade Ilha Tênis') + '</strong><span>Vencimento: ' + escapeHtml(dateLabel(item.dueDate)) + '</span>' + statusPill(item.status) + '</div><strong class="list-value">' + escapeHtml(money(item.amount)) + '</strong></article>';
      }

      function memberCard(item) {
        const confirmation = item.responsibleConfirmationRequired ? '<span class="pill warn">Dados aguardando confirmação</span>' : '';
        return '<article class="list-card"><div><strong>' + escapeHtml(item.fullName || 'Membro da família') + '</strong><span>' + escapeHtml((item.relationshipLabel || 'Familiar') + ' · ' + (item.birthDate ? dateLabel(item.birthDate) : 'idade não informada')) + '</span>' + confirmation + '</div><div><strong class="list-value">' + escapeHtml(item.monthlyAmount === '' || item.monthlyAmount == null ? 'Valor opcional' : money(item.monthlyAmount)) + '</strong>' + statusPill(item.status) + '</div></article>';
      }

      function productCard(item) {
        const image = safeImageUrl(item.imageUrl);
        const stockText = item.trackStock ? (Number(item.stock || 0) > 0 ? item.stock + ' em estoque' : 'Sem estoque') : 'Consulte a secretaria';
        return '<article class="product-card">' + (image ? '<img src="' + escapeHtml(image) + '" alt="" />' : '<div style="height:180px;display:grid;place-items:center;background:#e8efef;font-size:42px">▣</div>') + '<div class="product-copy"><strong>' + escapeHtml(item.name || 'Produto') + '</strong><p>' + escapeHtml(item.description || stockText) + '</p><b>' + escapeHtml(Number(item.salePrice || 0) > 0 ? money(item.salePrice) : 'Consulte') + '</b><span class="pill ' + (item.trackStock && Number(item.stock || 0) <= 0 ? 'bad' : '') + '">' + escapeHtml(stockText) + '</span></div></article>';
      }

      const nextBooking = bookings.filter(function (item) { return String(item.status || '').toUpperCase() !== 'CANCELADO'; })[0];
      const avatar = safeImageUrl(client.photo || client.avatarUrl);
      const planName = plan.name || client.officialPlanName || client.declaredPlanName || 'Plano ainda não vinculado';
      const planAmount = client.planAmount === '' || client.planAmount == null ? Number(plan.amount || 0) : Number(client.planAmount || 0);
      const clientStatus = String(client.status || 'PENDENTE').toUpperCase();
      const statusBanner = clientStatus === 'ATIVO' ? '' : '<div class="status-banner"><b>!</b><span>No aplicativo real este cliente está ' + escapeHtml(clientStatus === 'BLOQUEADO' ? 'bloqueado' : 'aguardando liberação') + '. Nesta visualização do ADM você pode conferir todas as áreas, mas o cliente verá os recursos bloqueados até a situação ser regularizada.</span></div>';
      const financeContent = payload.financialHidden
        ? '<div class="empty">As cobranças deste membro ficam na conta do responsável financeiro' + (family.responsible && family.responsible.name ? ', ' + escapeHtml(family.responsible.name) : '') + '.</div>'
        : listOrEmpty(invoices, invoiceCard, 'Nenhuma cobrança emitida para este cliente.');

      root.innerHTML =
        '<div class="app-shell">' +
          '<header class="topbar"><div class="brand"><img src="/logo.png" alt="Ilha Tênis" /><div class="brand-copy"><strong>PLAY</strong><span>perfil de ' + escapeHtml(firstName(client.name)) + '</span></div></div><button class="icon-button" type="button" data-open-view="notifications" aria-label="Abrir notificações">♢</button></header>' +
          '<main>' +
            '<section class="page active" data-page="home">' +
              '<div class="page-head"><div><h1>Olá, ' + escapeHtml(firstName(client.name)) + '</h1><p>Esta é a área que o cliente visualiza no Ilha Play.</p></div></div>' + statusBanner +
              '<div class="hero"><article class="plan-card"><div><span class="eyebrow">Meu plano</span><h2>' + escapeHtml(planName) + '</h2><p>' + escapeHtml(plan.description || 'Detalhes definidos pela equipe do clube.') + '</p></div><div class="plan-meta"><span>' + escapeHtml(planAmount > 0 ? money(planAmount) + ' / mês' : 'Sem cobrança definida') + '</span><span>' + escapeHtml(Number(client.weeklyLessons || plan.weeklyLessons || 0) + ' aula(s) por semana') + '</span></div></article>' +
              '<article class="play-card"><button class="play-action" type="button" data-open-view="play"><span>Reservar quadra</span><b>›</b></button><div class="next-booking"><span>Próxima reserva</span><strong>' + escapeHtml(nextBooking ? dateLabel(nextBooking.date) + ' às ' + nextBooking.time + ' · ' + nextBooking.court : 'Nenhuma reserva agendada') + '</strong></div></article></div>' +
              '<div class="shortcut-grid"><button class="shortcut" type="button" data-open-view="store"><span>▣</span><span><strong>Ilha Store</strong><small>Produtos disponíveis no clube</small></span></button><button class="shortcut" type="button" data-open-view="lessons"><span>▤</span><span><strong>Minhas aulas</strong><small>Grade e professores</small></span></button><button class="shortcut" type="button" data-open-view="profile"><span>◎</span><span><strong>Minha família</strong><small>Perfil e membros vinculados</small></span></button></div>' +
              '<h2 class="section-title">Comunicados recentes</h2>' + listOrEmpty(announcements.slice(0, 3), function (item) { return '<article class="list-card"><div><strong>' + escapeHtml(item.title || 'Comunicado') + '</strong><span>' + escapeHtml(item.body || '') + '</span></div><small class="list-value">' + escapeHtml(dateLabel(item.publishedAt)) + '</small></article>'; }, 'Nenhum comunicado disponível.') +
            '</section>' +
            '<section class="page" data-page="play"><div class="page-head"><div><h1>Jogar</h1><p>Reservas e disponibilidade do cliente.</p></div></div><div class="card"><h2 style="margin-top:0">Nova reserva</h2><div class="readonly-form"><div class="field"><label>Data</label><input disabled placeholder="Selecione a data" /></div><div class="field"><label>Quadra</label><select disabled><option>Selecione a quadra</option></select></div><div class="field"><label>Horário</label><select disabled><option>Selecione o horário</option></select></div><div class="field"><label>Adversário</label><input disabled placeholder="Selecione um participante" /></div></div><div class="status-banner" style="margin:14px 0 0"><b>i</b><span>A reserva está desabilitada porque esta é uma visualização somente leitura.</span></div></div><h2 class="section-title">Reservas do cliente</h2>' + listOrEmpty(bookings, bookingCard, 'Nenhuma reserva encontrada.') + '</section>' +
            '<section class="page" data-page="lessons"><div class="page-head"><div><h1>Minhas aulas</h1><p>Horários fixos vinculados a este aluno.</p></div></div>' + listOrEmpty(lessons, lessonCard, 'Nenhuma aula fixa cadastrada.') + '</section>' +
            '<section class="page" data-page="payments"><div class="page-head"><div><h1>Financeiro</h1><p>Cobranças exibidas para esta conta.</p></div></div>' + financeContent + '</section>' +
            '<section class="page" data-page="store"><div class="page-head"><div><h1>Ilha Store</h1><p>Catálogo visível no aplicativo.</p></div></div><div class="product-grid">' + (products.length ? products.map(productCard).join('') : '<div class="empty" style="grid-column:1/-1">Nenhum produto disponível.</div>') + '</div></section>' +
            '<section class="page" data-page="notifications"><div class="page-head"><div><h1>Notificações</h1><p>Comunicados disponíveis para o cliente.</p></div></div>' + listOrEmpty(announcements, function (item) { return '<article class="list-card"><div><strong>' + escapeHtml(item.title || 'Comunicado') + '</strong><span>' + escapeHtml(item.body || '') + '</span></div><small class="list-value">' + escapeHtml(dateLabel(item.publishedAt)) + '</small></article>'; }, 'Nenhuma notificação disponível nesta prévia.') + '</section>' +
            '<section class="page" data-page="profile"><div class="page-head"><div><h1>Meu perfil</h1><p>Dados pessoais, plano e família.</p></div></div><div class="profile-layout"><article class="profile-card"><div class="profile-avatar">' + (avatar ? '<img src="' + escapeHtml(avatar) + '" alt="" />' : escapeHtml(initials(client.name))) + '</div><h2>' + escapeHtml(client.name || 'Cliente') + '</h2><p>' + escapeHtml(client.email || 'E-mail não informado') + '</p><div class="detail-list"><div class="detail-row"><span>Telefone</span><strong>' + escapeHtml(phoneLabel(client.phone)) + '</strong></div><div class="detail-row"><span>CPF</span><strong>' + escapeHtml(cpfLabel(client.cpf)) + '</strong></div><div class="detail-row"><span>Nascimento</span><strong>' + escapeHtml(dateLabel(client.birthDate)) + '</strong></div><div class="detail-row"><span>Status</span><strong>' + escapeHtml(clientStatus) + '</strong></div></div></article><div><article class="profile-card"><h2>Meu plano</h2><div class="detail-list"><div class="detail-row"><span>Plano</span><strong>' + escapeHtml(planName) + '</strong></div><div class="detail-row"><span>Valor</span><strong>' + escapeHtml(planAmount > 0 ? money(planAmount) : 'Não definido') + '</strong></div><div class="detail-row"><span>Vencimento</span><strong>' + escapeHtml(client.dueDay ? 'Todo dia ' + client.dueDay : 'Não definido') + '</strong></div></div></article><h2 class="section-title">Minha família</h2>' + (family.responsible && !family.isResponsible ? '<article class="card" style="margin-bottom:10px"><span class="eyebrow" style="color:var(--teal)">Responsável financeiro</span><h3 style="margin:6px 0 0">' + escapeHtml(family.responsible.name || 'Responsável') + '</h3></article>' : '') + listOrEmpty(Array.isArray(family.members) ? family.members : [], memberCard, 'Nenhum membro familiar vinculado.') + '</div></div></section>' +
          '</main>' +
        '</div>' +
        '<nav class="bottom-nav" aria-label="Navegação do Ilha Play"><button class="active" type="button" data-nav-view="home"><b>⌂</b><span>Início</span></button><button type="button" data-nav-view="play"><b>▷</b><span>Jogar</span></button><button type="button" data-nav-view="lessons"><b>▤</b><span>Minhas aulas</span></button><button type="button" data-nav-view="payments"><b>$</b><span>Financeiro</span></button><button type="button" data-nav-view="profile"><b>◎</b><span>Meu perfil</span></button></nav>';

      function showView(view) {
        const target = root.querySelector('[data-page="' + view + '"]');
        if (!target) return;
        root.querySelectorAll('[data-page]').forEach(function (page) { page.classList.toggle('active', page === target); });
        root.querySelectorAll('[data-nav-view]').forEach(function (button) { button.classList.toggle('active', button.dataset.navView === view); });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      root.addEventListener('click', function (event) {
        const target = event.target.closest('[data-open-view], [data-nav-view]');
        if (!target) return;
        showView(target.dataset.openView || target.dataset.navView);
      });
    })();
  </script>
</body>
</html>
