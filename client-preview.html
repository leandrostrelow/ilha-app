<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visualização do Ilha Play</title></head>
<body><p>Abra a área do cliente novamente pelo ADM para consultar os dados atualizados.</p><a href="/adm">Voltar ao ADM</a>
<script>
try {
  const preview = JSON.parse(window.name || "{}");
  if (preview.kind === "ilha-client-readonly-preview-v2" && preview.expiresAt > Date.now()) location.replace("/?clientPreview=1");
  else window.name = "";
} catch (_) { window.name = ""; }
</script></body></html>
