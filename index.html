<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10272c" />
  <title>Ilha Play | Aplicativo oficial do clube</title>
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; background: #eef4f6; }
    body { display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; color: #083f4b; }
    .loading { display: grid; gap: 14px; justify-items: center; font-weight: 800; }
    .ball { width: 46px; height: 46px; border: 5px solid #d9e5e9; border-top-color: #b5e500; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading"><span class="ball"></span><span>Abrindo Ilha Play...</span></div>
  <script>
    fetch('/ilha-play-shell', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Falha ao abrir o Ilha Play.');
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML = '<div class="loading"><strong>Não foi possível abrir agora.</strong><button onclick="location.reload()">Tentar novamente</button></div>';
      });
  </script>
</body>
</html>
