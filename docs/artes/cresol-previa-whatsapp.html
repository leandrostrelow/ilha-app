<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia Ilha + Cresol</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eee}main{width:600px;height:600px;position:relative;overflow:hidden;background:#005c46}main:before{content:"";position:absolute;inset:12px;border:3px solid #f58220;border-radius:26px}.ilha{position:absolute;left:60px;top:76px;width:480px;height:auto}.cresol{position:absolute;left:125px;top:327px;width:350px;height:auto;filter:brightness(0) invert(1)}.plus{position:absolute;left:280px;top:262px;width:40px;height:40px}.plus:before,.plus:after{content:"";position:absolute;background:#f58220;border-radius:3px}.plus:before{width:34px;height:5px;left:3px;top:17.5px}.plus:after{width:5px;height:34px;left:17.5px;top:3px}
</style>
<main aria-label="Logos originais do Ilha Tênis Colatina e da Cresol, sobre fundo verde">
<img class="ilha" src="/cresol/assets/ilha.png" width="1365" height="415" alt="Ilha Tênis Colatina">
<span class="plus" aria-hidden="true"></span>
<img class="cresol" src="/cresol/assets/cresol-original.png" width="1664" height="1080" alt="Cresol">
</main>
</html>
